<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Champions har flyttat</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1a3a;color:#fff;font:18px/1.5 system-ui,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  a{display:inline-block;margin-top:16px;padding:14px 24px;border-radius:12px;background:#f5c542;color:#0b1a3a;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div id="msg">Quiz Champions har flyttat …</div>
<script>
  // Gamla adressen /Spel/quizkalas/ – skicka vidare till /Spel/quizchampions/ (med PIN m.m. kvar).
  var nyUrl = location.href.replace('/quizkalas/', '/quizchampions/').replace(/\/quizkalas$/, '/quizchampions/');
  var gammalApp = false;
  try { gammalApp = !!window.QCApp && QCApp.version() === '1.0'; } catch (e) {}
  if (gammalApp) {
    // Appen 1.1 känner bara till den gamla adressen – be om den nya versionen.
    document.getElementById('msg').innerHTML = 'Det finns en ny version av Quiz Champions-appen.<br>Ladda ner och installera den, så fungerar allt igen.<br><a href="../app/QuizChampions.apk">Ladda ner appen</a>';
  } else {
    location.replace(nyUrl);
  }
</script>
</body>
</html>
